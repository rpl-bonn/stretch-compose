<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stretch GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --card:#111827; --border:#1f2937; }
    *{box-sizing:border-box}
    body{ margin:0; padding:24px; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg); color:var(--fg); display:flex; flex-direction:column; align-items:center; gap:16px; }
    h1{margin:0 0 8px 0; font-size:28px; letter-spacing:.2px}
    .bar{display:flex; gap:10px; align-items:center; justify-content:center; width:100%}
    .status{font-size:14px; color:var(--muted)}
    .container{width:min(1100px, 96vw); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px;}
    .hidden{display:none}
    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; border:1px solid var(--border);
      background:#0b1220; color:var(--fg); padding:12px 16px; border-radius:12px; cursor:pointer; text-decoration:none;
      transition:transform .08s ease, border-color .2s ease, box-shadow .2s ease; }
    .btn:hover{border-color:#334155; box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .btn:active{transform:translateY(1px)}
    .grid2{display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:16px;}
    .card{ border:1px solid var(--border); border-radius:16px; padding:18px; background:linear-gradient(180deg,#0b1220,#0a0f1a);
      display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; transition:transform .1s ease, border-color .2s ease, box-shadow .2s ease; }
    .card:hover{transform:translateY(-2px); border-color:#334155; box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .hint{font-size:13px; color:var(--muted); text-align:center}

    /* Drawer shelf */
    .shelf-wrapper { display:flex; justify-content:center; align-items:center; margin:0 auto; }
    .shelf{
      position:relative; width:800px; max-width:100%; aspect-ratio:800/640;
      background:url('kallax.png') no-repeat center/cover;
      border:1px solid var(--border); border-radius:12px; overflow:hidden;
    }
    .drawer{position:absolute; cursor:pointer; outline:none; border-radius:6px}
    .drawer:hover{border:2px solid var(--accent); background:rgba(56,189,248,.18)}
    .flash{animation:flash .8s ease}
    @keyframes flash {0%{box-shadow:0 0 0 0 rgba(56,189,248,.9)} 100%{box-shadow:0 0 0 16px rgba(56,189,248,0)}}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .back{margin-bottom:12px}
    .mt{margin-top:12px}

    /* Gallery tiles */
    .gallery{display:grid; grid-template-columns:repeat(3, minmax(220px, 1fr)); gap:18px;}
    .tile{ border:2px solid var(--border); border-radius:16px; overflow:hidden; background:#0b1220; cursor:pointer;
      transition:transform .08s ease, border-color .2s ease, box-shadow .2s ease; }
    .tile:hover{transform:translateY(-1px); border-color:#334155; box-shadow:0 12px 36px rgba(0,0,0,.35)}
    .tile img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block}
    .tile .cap{padding:10px 12px; font-size:15px; color:#cbd5e1; text-align:center; border-top:1px solid var(--border)}
    .tile:focus-visible{outline:2px solid var(--accent);}
    .tile.selected{border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,.35) inset;}
    .grasp-status{margin-top:12px; font-weight:600; color:#cbd5e1}
  </style>
</head>
<body>
  <h1>Stretch Robot GUI</h1>
  <div class="bar status" id="status">Idle</div>

  <!-- Home -->
  <div class="container" id="view-home">
    <div class="grid2">
      <!-- Drawer card with Lucide "archive" -->
      <div class="card" onclick="showView('drawer')" title="Open a drawer">
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"
             viewBox="0 0 24 24" fill="none" stroke="#38bdf8"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <path d="M3 10h18"/>
          <path d="M3 16h18"/>
        </svg>
        <div class="hint">Open a drawer</div>
      </div>

      <!-- Search/Grasp card with Lucide "search" -->
      <div class="card" onclick="showView('grasp')" title="Find & grasp an object">
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"
             viewBox="0 0 24 24" fill="none" stroke="#38bdf8"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <div class="hint">Find an object</div>
      </div>
    </div>
  </div>

  <!-- Drawer view -->
  <div class="container hidden" id="view-drawer">
    <div class="row back">
      <button class="btn" onclick="showView('home')">← Home</button>
      <div class="hint">Click a compartment to open it</div>
    </div>
    <div class="shelf-wrapper">
      <div class="shelf" id="shelf">
        <div class="drawer" data-id="20" style="top:36.4%; left:11.625%; width:17.125%; height:10.15%;"></div>
        <div class="drawer" data-id="19" style="top:46.9%; left:11.625%; width:17.125%; height:10.3%;"></div>
        <div class="drawer" data-id="23" style="top:58.75%; left:49.0%; width:17.625%; height:11.25%;"></div>
        <div class="drawer" data-id="16" style="top:70.3%; left:49.0%; width:17.625%; height:10.47%;"></div>
      </div>
    </div>
    <div class="row mt"><div class="hint" id="drawerStatus">No drawer opened yet</div></div>
  </div>

  <!-- Grasp view -->
  <div class="container hidden" id="view-grasp">
    <div class="row back" style="gap:12px; align-items:flex-end;">
      <button class="btn" onclick="showView('home')">← Home</button>
      <div class="hint">Click a quick-pick object, or type anything and run a free-text grasp.</div>
    </div>

    <!-- Free-text control -->
    <div class="row" style="gap:10px; margin-bottom:12px; flex-wrap:wrap;">
      <input id="objectInput" type="text" placeholder="e.g., water bottle, ketchup bottle, cup, pringles"
        style="flex:1 1 380px; min-width:260px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#0b1220; color:var(--fg);" />
      <button class="btn" id="runBtn">Run</button>
    </div>

    <!-- Quick-pick grid -->
    <div id="gallery" class="gallery"></div>

    <div id="graspStatus" class="grasp-status"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const views = { home: el('view-home'), drawer: el('view-drawer'), grasp: el('view-grasp') };

    const DRAWER_MAP = { "20":"left_white_drawer_upper","19":"left_white_drawer_lower","23":"right_black_drawer_upper","16":"right_black_drawer_lower" };
    const fName = s => s.replace(/_/g,' ').split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');

    const IMAGES = [
      { id:'watering_can', label:'Watering Can', src:'watering can.jpg', aliases:['watering can','can','watering'] },
      { id:'cup', label:'Cup', src:'cup.jpg', aliases:['cup','mug'] },
      { id:'water_bottle', label:'Water Bottle', src:'water bottle.jpg', aliases:['water bottle','bottle'] },
      { id:'milk_carton', label:'Milk Carton', src:'milk carton.jpg', aliases:['milk','milk carton','carton'] },
      { id:'pringles', label:'Pringles', src:'pringles.jpg', aliases:['pringles','chips','snacks'] },
      { id:'tennis_ball', label:'Tennis Ball', src:'tennis ball.jpg', aliases:['tennis ball','ball'] },
    ];

    function showView(name){
      Object.values(views).forEach(v=>v.classList.add('hidden'));
      views[name].classList.remove('hidden');
      if(name==='drawer') el('drawerStatus').textContent='No drawer opened yet';
      if(name==='grasp'){ el('graspStatus').textContent=''; }
    }

    function setStatus(text){ statusEl.textContent = text; }
    function checkStatus(){
      fetch('http://127.0.0.1:5002/status')
        .then(r=>r.json()).then(d=> setStatus(d.running ? 'Robot is busy…' : 'Idle'))
        .catch(()=> setStatus('Server offline'));
    }
    setInterval(checkStatus, 2000); checkStatus();

    // Drawer click
    const shelf = el('shelf'), drawerStatus = el('drawerStatus');
    shelf.querySelectorAll('.drawer').forEach(elm=>{
      elm.addEventListener('click', ()=>{
        shelf.querySelectorAll('.drawer').forEach(x=>x.classList.remove('flash'));
        elm.classList.add('flash');
        const id = elm.getAttribute('data-id');
        drawerStatus.textContent = 'Opening: ' + fName(DRAWER_MAP[id] || id);
        fetch('http://127.0.0.1:5002/run', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id})
        }).then(r=>{ if(r.status===409) drawerStatus.textContent='Robot is busy…'; return r.json(); })
          .then(()=> checkStatus())
          .catch(console.error);
      });
    });

    // Build quick-pick gallery
    const gallery = el('gallery');
    IMAGES.forEach((item)=>{
      const card = document.createElement('button');
      card.className='tile'; card.type='button'; card.setAttribute('aria-label', item.label);
      card.innerHTML = `<img src="${item.src}" alt="${item.label}" loading="lazy"><div class="cap">${item.label}</div>`;
      card.addEventListener('click', ()=>{
        document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
        card.classList.add('selected');
        el('graspStatus').textContent = 'Grasping: ' + item.label;
        fetch('http://127.0.0.1:5002/grasp', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({object: item.id})
        }).then(r=>{ if(r.status===409) el('graspStatus').textContent='Robot is busy…'; return r.json(); })
          .then(()=> checkStatus())
          .catch(console.error);
      });
      gallery.appendChild(card);
    });

    // Free-text / unified Run
    const inputEl = el('objectInput');
    const norm = s => (s||'').toLowerCase().trim().replace(/\s+/g,' ');

    function findObjectByInput(input){
      const q = norm(input); if(!q) return null;
      for(const item of IMAGES){ if(item.aliases.some(a => norm(a) === q)) return item; }
      for(const item of IMAGES){ if(item.aliases.some(a => norm(a).startsWith(q))) return item; }
      for(const item of IMAGES){ if(item.aliases.some(a => norm(a).includes(q))) return item; }
      return null;
    }

    function runGrasp(){
      const txt = inputEl.value.trim();
      if(!txt){ el('graspStatus').textContent = 'Type an object name first.'; return; }

      const item = findObjectByInput(txt);

      if(item){
        document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
        const tile = Array.from(document.querySelectorAll('#gallery .tile'))
          .find(t => t.querySelector('.cap')?.textContent === item.label);
        if(tile){ tile.classList.add('selected'); tile.scrollIntoView({behavior:'smooth', block:'center'}); }

        el('graspStatus').textContent = 'Grasping: ' + item.label;
        fetch('http://127.0.0.1:5002/grasp', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({object: item.id})
        }).then(r=>{ if(r.status===409) el('graspStatus').textContent='Robot is busy…'; return r.json(); })
          .then(()=> checkStatus())
          .catch(console.error);
      } else {
        el('graspStatus').textContent = 'Grasping (free-text): ' + txt;
        fetch('http://127.0.0.1:5002/grasp', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({object: txt, raw: true})
        }).then(r=>{ if(r.status===409) el('graspStatus').textContent='Robot is busy…'; return r.json(); })
          .then(()=> checkStatus())
          .catch(console.error);
      }
    }

    el('runBtn').addEventListener('click', runGrasp);
    inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); runGrasp(); } });

    function el(id){ return document.getElementById(id); }
    showView('home');
  </script>
</body>
</html>
